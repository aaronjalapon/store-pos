services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gma_pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d gma_pos"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: ./docker/minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: gma-pos/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: amazon/aws-cli:2.36.44
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket gma-pos-backups ||
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket gma-pos-backups

volumes:
  postgres_data:
  minio_data:
