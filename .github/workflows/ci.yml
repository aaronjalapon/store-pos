name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gma_pos_test
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos -d gma_pos_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://pos:pos@127.0.0.1:5432/gma_pos_test
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://pos:pos@127.0.0.1:5432/gma_pos_test
      - run: git diff --check

  real-stack:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start disposable PostgreSQL and MinIO
        run: docker compose -p store-pos-ci -f docker-compose.audit.yml up -d --build --wait
      - name: Migrate and verify rerun
        env:
          DATABASE_URL: postgresql://pos_audit:audit-only@127.0.0.1:55433/gma_pos_audit
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Start built API
        env:
          NODE_ENV: development
          PORT: 4400
          DATABASE_URL: postgresql://pos_audit:audit-only@127.0.0.1:55433/gma_pos_audit
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          METRICS_TOKEN: ci-only-metrics-token-at-least-24-characters
          S3_ENDPOINT: http://127.0.0.1:59000
          S3_REGION: us-east-1
          S3_BUCKET: gma-pos-audit
          S3_ACCESS_KEY: audit-access
          S3_SECRET_KEY: audit-secret-key
          S3_FORCE_PATH_STYLE: "true"
          BACKUP_ENCRYPTION_ACTIVE_KEY_ID: audit
          BACKUP_ENCRYPTION_KEYS_JSON: '{"audit":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          BACKUP_MAX_BYTES: "104857600"
        run: |
          npm run start -w @gma/api >/tmp/gma-pos-api.log 2>&1 &
          echo $! >/tmp/gma-pos-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4400/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gma-pos-api.log
          exit 1
      - name: Run real-stack acceptance
        env:
          AUDIT_API_URL: http://127.0.0.1:4400
          AUDIT_DATABASE_URL: postgresql://pos_audit:audit-only@127.0.0.1:55433/gma_pos_audit
        run: npm run test:real-stack
      - name: Verify business flows, recovery, and upgrade compatibility
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://pos_audit:audit-only@127.0.0.1:55433/gma_pos_audit
          AUDIT_DATABASE_URL: postgresql://pos_audit:audit-only@127.0.0.1:55433/gma_pos_audit
          AUDIT_API_URL: http://127.0.0.1:4400
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          METRICS_TOKEN: ci-only-metrics-token-at-least-24-characters
          S3_ENDPOINT: http://127.0.0.1:59000
          S3_REGION: us-east-1
          S3_BUCKET: gma-pos-audit
          S3_ACCESS_KEY: audit-access
          S3_SECRET_KEY: audit-secret-key
          S3_FORCE_PATH_STYLE: "true"
          BACKUP_ENCRYPTION_ACTIVE_KEY_ID: audit
          BACKUP_ENCRYPTION_KEYS_JSON: '{"audit":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          BACKUP_MAX_BYTES: "104857600"
        run: npm run test:final-qa
      - name: Build production images
        run: |
          docker build -f Dockerfile.api -t gma-pos-api:ci .
          docker build -f Dockerfile.web -t gma-pos-web:ci .
      - name: Collect API logs
        if: failure()
        run: cat /tmp/gma-pos-api.log || true
      - name: Tear down disposable stack
        if: always()
        run: |
          if test -f /tmp/gma-pos-api.pid; then kill "$(cat /tmp/gma-pos-api.pid)" || true; fi
          docker compose -p store-pos-ci -f docker-compose.audit.yml down --volumes
