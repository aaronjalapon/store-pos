services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gma_pos_audit
      POSTGRES_USER: pos_audit
      POSTGRES_PASSWORD: audit-only
    ports: ["55433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_audit -d gma_pos_audit"]
      interval: 2s
      timeout: 2s
      retries: 20
  minio:
    build:
      context: ./docker/minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: gma-pos/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data
    environment:
      MINIO_ROOT_USER: audit-access
      MINIO_ROOT_PASSWORD: audit-secret-key
    ports: ["59000:9000"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 20
  minio-init:
    image: amazon/aws-cli:2.36.44
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: audit-access
      AWS_SECRET_ACCESS_KEY: audit-secret-key
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: ["aws --endpoint-url http://minio:9000 s3api create-bucket --bucket gma-pos-audit"]
